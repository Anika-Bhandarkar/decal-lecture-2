[project]
name = "decal-lecture-2"
version = "0.1.0"
description = "In-class fine-tuning activity: SFT a small model on Tinker, generate data via OpenRouter"
requires-python = ">=3.11,<3.14"
dependencies = [
    "tinker>=0.30",
    "tinker-cookbook>=0.5",
    "openai>=1.0",
    # torch is only used for small tensors on the CPU. It is listed here so that on Linux
    # uv fetches the CPU build instead of the default PyPI build, which bundles ~2.5 GB of CUDA libraries.
    "torch>=2.0; sys_platform != 'darwin' or platform_machine != 'x86_64'",
    # PyTorch stopped publishing Intel Mac wheels after 2.2.2, and torch 2.2 was built against NumPy 1.x.
    "torch>=2.2,<2.3; sys_platform == 'darwin' and platform_machine == 'x86_64'",
    "numpy<2; sys_platform == 'darwin' and platform_machine == 'x86_64'",
]

[tool.uv]
# This is a folder of scripts, not an installable package.
package = false
# Make sure the lockfile covers Intel Macs, which only have wheels for older torch versions.
required-environments = ["sys_platform == 'darwin' and platform_machine == 'x86_64'"]

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
